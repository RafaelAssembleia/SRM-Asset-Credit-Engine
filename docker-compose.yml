services:
  postgres:
    image: postgres:17
    container_name: srm-postgres

    environment:
      POSTGRES_DB: srm_credit_engine
      POSTGRES_USER: srm_user
      POSTGRES_PASSWORD: srm_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srm_user -d srm_credit_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend

    container_name: srm-backend

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/srm_credit_engine
      DB_USERNAME: srm_user
      DB_PASSWORD: srm_password

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080

    container_name: srm-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  postgres_data: